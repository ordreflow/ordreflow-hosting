name: ordreflow-test

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:?DB_NAME is required}"
      POSTGRES_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrations:
    image: "${MIGRATIONS_IMAGE:?MIGRATIONS_IMAGE is required}"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_ISSUER: ordreflow-api
      JWT_AUDIENCE: ordreflow-frontend
      JWT_EXPIRES_MINUTES: "60"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - dotnet
      - ef
      - database
      - update
      - --project
      - Backend/Persistence/Persistence.csproj
      - --startup-project
      - Backend/WebApi/WebApi.csproj
      - --configuration
      - Release

  seed:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: "${DB_NAME:?DB_NAME is required}"
      PGUSER: "${DB_USERNAME:?DB_USERNAME is required}"
      PGPASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    volumes:
      - ./seed-demo.sql:/seed-demo.sql:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/seed-demo.sql"]

  api:
    image: "${API_IMAGE:?API_IMAGE is required}"
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_ISSUER: ordreflow-api
      JWT_AUDIENCE: ordreflow-frontend
      JWT_EXPIRES_MINUTES: "60"
    depends_on:
      seed:
        condition: service_completed_successfully

  frontend:
    image: "${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}"
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8080
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      TEST_DOMAIN: "${TEST_DOMAIN:?TEST_DOMAIN is required}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
