apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/ordreflow
  - ingress.yaml
images:
  - name: ghcr.io/ordreflow/ordreflow-migrations
    newName: ordreflow-migrations
    newTag: local
  - name: ghcr.io/ordreflow/ordreflow-api
    newName: ordreflow-api
    newTag: local
  - name: ghcr.io/ordreflow/ordreflow-frontend
    newName: ordreflow-frontend
    newTag: local
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: Never
