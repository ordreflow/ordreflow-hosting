apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ordreflow
  namespace: ordreflow
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["${APP_HOST}"]
      secretName: ordreflow-tls
  rules:
    - host: "${APP_HOST}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
