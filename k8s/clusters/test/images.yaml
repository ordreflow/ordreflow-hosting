apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: backend-migrations
  namespace: flux-system
spec:
  # Backend CI publishes API first, then migrations. This is the release signal
  # for both :dev workloads; no separate API ImageRepository is needed.
  image: ghcr.io/ordreflow/ordreflow-migrations
  interval: 1m
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: backend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: backend-migrations
  digestReflectionPolicy: Always
  interval: 1m
  filterTags:
    pattern: '^dev$'
  policy:
    alphabetical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: frontend
  namespace: flux-system
spec:
  image: ghcr.io/ordreflow/ordreflow-frontend
  interval: 1m
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: frontend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: frontend
  digestReflectionPolicy: Always
  interval: 1m
  filterTags:
    pattern: '^dev$'
  policy:
    alphabetical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: test
  namespace: flux-system
spec:
  interval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: 'Update test container images'
    push:
      branch: main
  update:
    path: ./k8s/overlays/dev
    strategy: Setters
