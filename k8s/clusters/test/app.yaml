apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ordreflow
  namespace: flux-system
spec:
  interval: 2m
  path: ./k8s/overlays/dev
  prune: true
  dependsOn:
    - name: issuer
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: k3s-test-settings
