apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: issuer
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/infra/issuer
  prune: true
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      ACME_EMAIL: admin@example.com # Replace before bootstrapping Flux.
