apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ordreflow
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ordreflow
spec:
  # The single replica serializes database migrations for this test environment.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: migrate
          # Backend CI pushes this image last; its Flux policy selects the tag
          # for both images, so the API cannot get ahead of its migrations.
          image: ghcr.io/ordreflow/ordreflow-migrations:dev
          command: [dotnet, ef, database, update]
          args:
            - --project
            - Backend/Persistence/Persistence.csproj
            - --startup-project
            - Backend/WebApi/WebApi.csproj
            - --configuration
            - Release
          envFrom:
            - configMapRef:
                name: ordreflow-config
            - secretRef:
                name: ordreflow-secrets
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
      containers:
        - name: api
          image: ghcr.io/ordreflow/ordreflow-api:dev
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
          envFrom:
            - configMapRef:
                name: ordreflow-config
            - secretRef:
                name: ordreflow-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
