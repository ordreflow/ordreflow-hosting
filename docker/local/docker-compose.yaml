services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${DB_NAME:?DB_NAME is required}"
      POSTGRES_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    ports:
      - "${DB_PORT:-DB_HOST}:5432"
    volumes:
      - ordreflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrations:
    image: ordreflow-migrations:local
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
      JWT_EXPIRES_MINUTES: "${JWT_EXPIRES_MINUTES:?JWT_EXPIRES_MINUTES is required}"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - dotnet
      - ef
      - database
      - update
      - --project
      - Backend/Persistence/Persistence.csproj
      - --startup-project
      - Backend/WebApi/WebApi.csproj
      - --configuration
      - Release

  api:
    image: ordreflow-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_HTTP_PORTS: "8080"
      DEV_USER_ID: "5e530cd5-924a-445d-84ef-69bfb21ee241"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
      JWT_EXPIRES_MINUTES: "${JWT_EXPIRES_MINUTES:?JWT_EXPIRES_MINUTES is required}"
    depends_on:
      migrations:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8080}:8080"
  
  frontend:
    image: ordreflow-frontend:local
    environment:
      API_UPSTREAM: "http://api:8080"
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    depends_on:
      - api

volumes:
  ordreflow-postgres-data: